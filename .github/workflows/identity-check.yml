# Manual metadata diagnostic. No Firebase API or credential authentication.
name: Firebase identity metadata check
"on":
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Print only validated project and service account email
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
        shell: bash --noprofile --norc -e {0}
        run: |
          python3 -I -S - --metadata-only <<'PY'
          """Approved metadata-only diagnostic; never authenticates to Firebase."""
          import json
          import os
          import re
          import sys
          
          EXPECTED_PROJECT = 'dailypick10-94209'
          EMAIL = re.compile(r'[a-z][a-z0-9._-]{0,127}@' + re.escape(EXPECTED_PROJECT) + r'\.iam\.gserviceaccount\.com')
          
          
          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError('Duplicate field')
                  result[key] = value
              return result
          
          
          def inspect_metadata(raw):
              if not isinstance(raw, str) or not 1 <= len(raw.encode('utf-8')) <= 65536:
                  raise ValueError('Missing or oversized input')
              value = json.loads(raw, object_pairs_hook=unique_object)
              if not isinstance(value, dict) or value.get('type') != 'service_account':
                  raise ValueError('Unsupported input')
              if value.get('project_id') != EXPECTED_PROJECT:
                  raise ValueError('Unexpected project')
              email = value.get('client_email')
              if not isinstance(email, str) or EMAIL.fullmatch(email) is None:
                  raise ValueError('Unexpected email')
              # Do not inspect, derive, encode, log, or output any other credential field.
              return {'project_id': EXPECTED_PROJECT, 'client_email': email}
          
          
          def main(argv=None):
              if (sys.argv[1:] if argv is None else argv) != ['--metadata-only']:
                  print('Identity diagnostic disabled: explicit metadata-only invocation required.', file=sys.stderr)
                  return 2
              try:
                  result = inspect_metadata(os.environ.get('FIREBASE_CREDENTIALS'))
              except Exception:
                  # Never include exception text, raw input, a fragment, or an environment dump.
                  print('Identity metadata unavailable: missing, invalid, or outside the expected project.', file=sys.stderr)
                  return 2
              print(json.dumps(result, separators=(',', ':')))
              return 0
          
          
          if __name__ == '__main__':
              raise SystemExit(main())
          PY
