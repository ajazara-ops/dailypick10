name: Daily Stock Scanner

on:
  schedule:
    - cron: '31 9 * * 1-5'
    - cron: '15 23 * * 1-5'
    - cron: '0 8 * * 6'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Explicit execution mode'
        required: true
        default: daily
        type: choice
        options: [daily, weekly, weekly_summary]
      target:
        description: 'Target market'
        required: true
        default: ALL
        type: choice
        options: [ALL, US, KR]

permissions:
  contents: write

concurrency:
  group: stock-data-publisher
  cancel-in-progress: false

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Resolve event intent
        id: intent
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$EVENT_SCHEDULE" = "31 9 * * 1-5" ]; then
            printf 'mode=daily\ntarget=KR\n' >> "$GITHUB_OUTPUT"
          else
            python scripts/resolve_scan_event.py
          fi
      - name: Install dependencies
        run: pip install yfinance pandas requests lxml firebase-admin exchange-calendars==4.13.2
      - name: Run Scan Logic
        env:
          SCAN_MODE: ${{ steps.intent.outputs.mode }}
          SCAN_TARGET: ${{ steps.intent.outputs.target }}
        run: python daily_stock_scanner.py --mode "$SCAN_MODE" --target "$SCAN_TARGET"
      - name: Commit and Push
        env:
          SCAN_MODE: ${{ steps.intent.outputs.mode }}
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          for path in todays_recommendation.json daily_data weekly_reports history_index.json; do
            if [ -e "$path" ]; then git add -- "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Update stock data ($SCAN_MODE)"
            git push
          fi
      - name: Deliver generated notification after publishing
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
        run: python daily_stock_scanner.py --mode notify --notify
